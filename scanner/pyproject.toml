[project]
name = "boundarylens"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "sqlalchemy==2.1.6",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]
[project.optional-dependencies]
test = ["pytest==9.1.1"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project.scripts]
boundarylens = "boundarylens.cli:main"

[tool.setuptools.packages.find]
include = ["boundarylens*"]
